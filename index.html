<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#050505" />
  <meta name="description"
    content="CineFlow Ultra — A premium cinematic streaming experience with curated collections, 4K titles, and AI-powered discovery." />
  <title>CineFlow Ultra</title>

  <!-- Performance: DNS prefetch & preconnect for external resources -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://esm.sh" />
  <link rel="dns-prefetch" href="https://img.omdbapi.com" />
  <link rel="dns-prefetch" href="https://www.omdbapi.com" />
  <link rel="dns-prefetch" href="https://images.unsplash.com" />

  <style>
    /* Critical above-the-fold CSS — minimal to avoid override conflicts with index.css */
    :root {
      font-size: 16px;
      background-color: #050505;
    }
    body {
      background-color: #050505;
      color: #fff;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    /* Prevent flash of unstyled content */
    #root:empty::before {
      content: '';
      display: block;
      position: fixed;
      inset: 0;
      background: #050505;
    }
  </style>

  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "lucide-react": "https://esm.sh/lucide-react@^0.575.0",
    "framer-motion": "https://esm.sh/framer-motion@^12.34.2",
    "@google/genai": "https://esm.sh/@google/genai@^1.42.0"
  }
}
</script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
