<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#09090b" />
  <title>CineFlow Ultra</title>

  <!-- Performance: DNS prefetch & preconnect for external resources -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://esm.sh" />
  <link rel="dns-prefetch" href="https://img.omdbapi.com" />
  <link rel="dns-prefetch" href="https://www.omdbapi.com" />
  <link rel="dns-prefetch" href="https://images.unsplash.com" />

  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Fonts: Inter + Space Grotesk with font-display=swap to avoid FOIT.
         Cinzel (display font) is loaded async to unblock rendering. -->
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@300;400;600&display=swap"
    rel="stylesheet" />
  <!-- Cinzel loaded async (non-blocking) -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&display=swap" rel="stylesheet"
    media="print" onload="this.media='all'" />

  <style>
    /* Critical above-the-fold CSS */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: #09090b;
      color: #fff;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
      font-family: 'Space Grotesk', system-ui, sans-serif;
    }

    .font-serif-display {
      font-family: 'Cinzel', 'Georgia', serif;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Reduced blur on mobile for GPU performance */
    .glass-panel {
      background: rgba(20, 20, 20, 0.75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    @media (min-width: 768px) {
      .glass-panel {
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }
    }

    /* Skeleton loading screen */
    #root:empty::before {
      content: '';
      display: block;
      position: fixed;
      inset: 0;
      background: #09090b;
    }

    /* Thin styled scrollbar for episode lists */
    .ep-scroll::-webkit-scrollbar {
      width: 4px;
    }

    .ep-scroll::-webkit-scrollbar-track {
      background: #27272a;
      border-radius: 4px;
    }

    .ep-scroll::-webkit-scrollbar-thumb {
      background: #a16207;
      border-radius: 4px;
    }

    .ep-scroll::-webkit-scrollbar-thumb:hover {
      background: #eab308;
    }
  </style>

  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "lucide-react": "https://esm.sh/lucide-react@^0.575.0",
    "framer-motion": "https://esm.sh/framer-motion@^12.34.2",
    "@google/genai": "https://esm.sh/@google/genai@^1.42.0"
  }
}
</script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
